[platformio]
default_envs = wokwi

[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  beegee-tokyo/DHT sensor library for ESPx@1.19.0
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@4.0.6

[env:esp32dev]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DKRISHI_GUARD_ENABLE_TELEMETRY=1
  -DKRISHI_GUARD_PHYSICAL_BUILD=1

[env:wokwi]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DKRISHI_GUARD_WOKWI=1

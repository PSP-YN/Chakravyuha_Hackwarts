[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  beegee-tokyo/DHT sensor library for ESPx
  paulstoffregen/OneWire
  milesburton/DallasTemperature

[env:esp32dev]
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:wokwi]
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DKRISHI_GUARD_WOKWI=1
